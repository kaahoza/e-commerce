version: "3.9"

services:

  # ---------- Databases (one per service) ----------

  product-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - product_db_data:/var/lib/postgresql/data
    networks:
      - minishop-net

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  user-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - user_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - minishop-net

  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - order_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - minishop-net

  # ---------- Services ----------

  product-service:
    build: ./product-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: product-db
      DB_PORT: 5432
      DB_NAME: product_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      product-db:
        condition: service_healthy
    networks:
      - minishop-net

  user-service:
    build: ./user-service
    ports:
      - "8082:8082"
    environment:
      DB_HOST: user-db
      DB_PORT: 5432
      DB_NAME: user_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: minishop-docker-secret-change-me-in-real-deployments-please
      JWT_EXPIRATION_MS: 3600000
    depends_on:
      user-db:
        condition: service_healthy
    networks:
      - minishop-net

  order-service:
    build: ./order-service
    ports:
      - "8083:8083"
    environment:
      DB_HOST: order-db
      DB_PORT: 5432
      DB_NAME: order_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      PRODUCT_SERVICE_URL: http://product-service:8081
      USER_SERVICE_URL: http://user-service:8082
    depends_on:
      order-db:
        condition: service_healthy
      product-service:
        condition: service_started
      user-service:
        condition: service_started
    networks:
      - minishop-net

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      PRODUCT_SERVICE_URL: http://product-service:8081
      USER_SERVICE_URL: http://user-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
    depends_on:
      - product-service
      - user-service
      - order-service
    networks:
      - minishop-net

volumes:
  product_db_data:
  user_db_data:
  order_db_data:

networks:
  minishop-net:
    driver: bridge
